<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="예비 강사 프로필 등록이 완료되었습니다.">
  <title>프로필 등록 완료</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="./mobile.css">
  <script src="./analytics.js" defer></script>
</head>
<body>
  <main class="mobile-page complete-page">
    <div class="complete-visual" aria-hidden="true">
      <img src="./uploads/kv_02.png" alt="">
    </div>

    <section class="complete-content" aria-labelledby="complete-title">
      <div class="check-icon" aria-hidden="true">✓</div>
      <h1 id="complete-title" class="complete-title">등록이 완료되었습니다</h1>
      <p class="complete-subtitle">참여해 주셔서 감사합니다.</p>

      <div class="complete-card">
        <p>서비스 오픈 후 입력하신 지역과 조건에 맞는 미술 교육·채용 기회가 확인되면 이메일로 안내해 드리겠습니다.</p>
      </div>

      <div class="complete-note">
        <p>언제든지 연락 수신 거부 또는 정보 삭제를 요청할 수 있습니다.</p>
      </div>

      <!-- 공유하기 섹션 -->
      <div class="share-section" aria-label="공유하기">
        <p class="share-label">주변 미술 강사분께도 알려주세요 🎨</p>
        <div class="share-buttons">
          <button id="share-btn" class="share-button share-button-primary" type="button">
            <span class="share-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </span>
            링크 공유하기
          </button>
          <button id="copy-btn" class="share-button share-button-secondary" type="button">
            <span class="share-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </span>
            <span id="copy-btn-text">링크 복사</span>
          </button>
        </div>
        <p id="copy-toast" class="copy-toast" hidden aria-live="polite">링크가 복사되었습니다! ✓</p>
      </div>

      <a class="return-link" href="./1-intro.dc.html" data-analytics-event="complete_return_clicked"><span aria-hidden="true">←</span><span>처음으로 돌아가기</span></a>
    </section>
  </main>

  <script>
    const shareUrl  = window.location.origin + '/1-intro.dc.html';
    const shareText = '미술 강사 교육·채용 수요 조사에 참여해 보세요! 약 1분이면 완료됩니다.';

    const shareBtn = document.getElementById('share-btn');
    const copyBtn  = document.getElementById('copy-btn');
    const copyBtnText = document.getElementById('copy-btn-text');
    const copyToast = document.getElementById('copy-toast');

    // Web Share API 지원 여부에 따라 공유 버튼 표시/숨김
    if (!navigator.share) {
      shareBtn.hidden = true;
    }

    shareBtn.addEventListener('click', async () => {
      try {
        await navigator.share({ title: '미술 강사 교육·채용 수요 조사', text: shareText, url: shareUrl });
      } catch (_) { /* 사용자가 취소한 경우 무시 */ }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
      } catch (_) {
        // clipboard API 실패 시 fallback
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtnText.textContent = '복사 완료!';
      copyToast.hidden = false;
      setTimeout(() => {
        copyBtnText.textContent = '링크 복사';
        copyToast.hidden = true;
      }, 2500);
    });
  </script>
</body>
</html>
