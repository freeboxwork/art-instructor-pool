<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="예비 강사 프로필 등록이 완료되었습니다.">
  <title>프로필 등록 완료</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="./mobile.css">
  <script src="./analytics.js" defer></script>
</head>
<body>
  <main class="mobile-page complete-page">
    <div class="complete-visual" aria-hidden="true">
      <img src="./uploads/kv_02.png" alt="">
    </div>

    <section class="complete-content" aria-labelledby="complete-title">
      <div class="check-icon" aria-hidden="true">✓</div>
      <h1 id="complete-title" class="complete-title">등록이 완료되었습니다</h1>
      <p class="complete-subtitle">참여해 주셔서 감사합니다.</p>

      <div class="complete-card">
        <p>서비스 오픈 후 입력하신 지역과 조건에 맞는 미술 교육·채용 기회가 확인되면 이메일로 안내해 드리겠습니다.</p>
      </div>

      <!-- 공유하기 섹션 -->
      <div class="share-section" aria-label="공유하기">
        <p class="share-label">주변 미술 강사분께도 알려주세요 🎨</p>
        <div class="share-buttons">
          <button id="share-btn" class="share-button share-button-secondary" type="button">
            <span class="share-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </span>
            <span id="share-btn-text" aria-live="polite">링크 공유하기</span>
          </button>
        </div>
      </div>

      <a class="return-link" href="./1-intro.dc.html" data-analytics-event="complete_return_clicked"><span aria-hidden="true">←</span><span>처음으로 돌아가기</span></a>
    </section>
  </main>

  <script>
    function buildShareUrl(medium) {
      const url = new URL('/1-intro.dc.html', window.location.origin);
      url.searchParams.set('utm_source', 'participant_share');
      url.searchParams.set('utm_medium', medium);
      url.searchParams.set('utm_campaign', 'instructor_referral');
      return url.toString();
    }

    const nativeShareUrl = buildShareUrl('native_share');
    const copyShareUrl = buildShareUrl('link_copy');
    const shareText = '미술 강사 교육·채용 수요 조사에 참여해 보세요! 약 1분이면 완료됩니다.';

    const shareBtn = document.getElementById('share-btn');
    const shareBtnText = document.getElementById('share-btn-text');

    // 클립보드 복사 후 버튼 문구로 완료 상태를 잠시 보여준다
    async function copyLink() {
      try {
        await navigator.clipboard.writeText(copyShareUrl);
      } catch (_) {
        // clipboard API 실패 시 fallback
        const ta = document.createElement('textarea');
        ta.value = copyShareUrl;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      shareBtnText.textContent = '복사 완료!';
      setTimeout(() => {
        shareBtnText.textContent = '링크 공유하기';
      }, 2500);
    }

    // 공유 시트를 지원하면 띄우고, 아니면 링크 복사로 대체한다
    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({ title: '미술 강사 교육·채용 수요 조사', text: shareText, url: nativeShareUrl });
          return;
        } catch (err) {
          // 사용자가 취소한 경우에는 복사로 넘어가지 않는다
          if (err && err.name === 'AbortError') return;
        }
      }
      await copyLink();
    });
  </script>
</body>
</html>
